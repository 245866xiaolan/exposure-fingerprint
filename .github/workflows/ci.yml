name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: run tests
        run: python tests/test_rules.py
      - name: smoke
        run: python analyze.py data/sample_hits.jsonl | head -5
